<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | NASSAH Concept</title>

    <link rel="stylesheet" href="../css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        .cart-page {
            min-height: 75vh;
            padding: 80px 7%;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 55px;
        }

        .cart-title p {
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .cart-title h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(40px, 6vw, 65px);
            letter-spacing: 3px;
        }

        .cart-title h1 span {
            color: var(--gold);
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 35px;
            align-items: start;
        }

        .cart-items {
            border-top: 1px solid #292929;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 120px 1fr auto;
            gap: 25px;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid #292929;
        }

        .cart-image {
            width: 120px;
            height: 120px;
            background:
                radial-gradient(circle, #292929, #0c0c0c);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-image i {
            color: var(--gold);
            font-size: 45px;
        }

        .cart-info small {
            color: var(--gold);
            font-size: 9px;
            letter-spacing: 2px;
        }

        .cart-info h3 {
            font-family: 'Cinzel', serif;
            margin: 10px 0;
        }

        .cart-price {
            color: #aaa;
            font-size: 13px;
        }

        .quantity {
            display: flex;
            align-items: center;
            border: 1px solid #333;
            width: fit-content;
            margin-top: 18px;
        }

        .quantity button {
            width: 35px;
            height: 35px;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
        }

        .quantity button:hover {
            color: var(--gold);
        }

        .quantity span {
            width: 35px;
            text-align: center;
            font-size: 12px;
        }

        .item-total {
            color: var(--gold);
            font-weight: 600;
            text-align: right;
        }

        .remove-item {
            display: block;
            margin-top: 15px;
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            font-size: 11px;
        }

        .remove-item:hover {
            color: #e74c3c;
        }

        .summary {
            background: #0d0d0d;
            border: 1px solid #292929;
            padding: 30px;
            position: sticky;
            top: 110px;
        }

        .summary h2 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #242424;
            color: #aaa;
            font-size: 13px;
        }

        .summary-row.total {
            color: white;
            font-size: 19px;
            border-bottom: none;
        }

        .summary-row.total strong {
            color: var(--gold);
        }

        .checkout-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 17px;
            border: none;
            background: var(--gold);
            color: #000;
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: var(--gold-light);
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--gold);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .empty-cart {
            display: none;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-cart i {
            color: var(--gold);
            font-size: 60px;
            margin-bottom: 25px;
        }

        .empty-cart h2 {
            font-family: 'Cinzel', serif;
            margin-bottom: 12px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary {
                position: static;
            }
        }

        @media (max-width: 600px) {

            .cart-page {
                padding: 60px 5%;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 15px;
            }

            .cart-image {
                width: 80px;
                height: 80px;
            }

            .cart-image i {
                font-size: 30px;
            }

            .item-total {
                grid-column: 2;
                text-align: left;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <div class="logo">
        <img src="../images/nassah-logo.jpeg" alt="NASSAH Concept">
    </div>

    <nav class="navbar">

        <a href="../index.html">
            Home
        </a>

        <a href="shop.html">
            Shop
        </a>

        <a href="../index.html#collections">
            Collections
        </a>

        <a href="../index.html#about">
            About
        </a>

        <a href="../index.html#contact">
            Contact
        </a>

    </nav>

    <div class="header-icons">

        <a href="login.html">
            <i class="fa-regular fa-user"></i>
        </a>

        <a href="cart.html" class="cart-icon">
            <i class="fa-solid fa-bag-shopping"></i>
            <span id="cart-count">0</span>
        </a>

        <button class="menu-btn" id="menu-btn">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>

</header>


<main class="cart-page">

    <div class="cart-title">

        <p>YOUR SELECTION</p>

        <h1>
            SHOPPING <span>BAG</span>
        </h1>

    </div>


    <div id="emptyCart" class="empty-cart">

        <i class="fa-solid fa-bag-shopping"></i>

        <h2>Your shopping bag is empty</h2>

        <p>
            Discover our collection of timeless NASSAH watches.
        </p>

        <a href="shop.html" class="gold-btn">
            SHOP WATCHES
        </a>

    </div>


    <div class="cart-layout" id="cartLayout">

        <div class="cart-items" id="cartItems"></div>


        <aside class="summary">

            <h2>ORDER SUMMARY</h2>

            <div class="summary-row">

                <span>Subtotal</span>

                <span id="subtotal">
                    ₦0
                </span>

            </div>


            <div class="summary-row">

                <span>Delivery</span>

                <span id="delivery">
                    ₦3,000
                </span>

            </div>


            <div class="summary-row total">

                <span>Total</span>

                <strong id="total">
                    ₦0
                </strong>

            </div>


            <a
                href="checkout.html"
                class="checkout-btn"
                id="checkoutBtn"
            >
                PROCEED TO CHECKOUT
            </a>


            <a
                href="shop.html"
                class="continue-shopping"
            >
                ← CONTINUE SHOPPING
            </a>

        </aside>

    </div>

</main>


<script>

    const cartItems =
        document.getElementById("cartItems");

    const cartLayout =
        document.getElementById("cartLayout");

    const emptyCart =
        document.getElementById("emptyCart");

    const subtotalElement =
        document.getElementById("subtotal");

    const totalElement =
        document.getElementById("total");

    const cartCount =
        document.getElementById("cart-count");


    function getCart() {

        return JSON.parse(
            localStorage.getItem("nassahCart")
        ) || [];

    }


    function saveCart(cart) {

        localStorage.setItem(
            "nassahCart",
            JSON.stringify(cart)
        );

    }


    function formatPrice(price) {

        return "₦" +
            Number(price).toLocaleString();

    }


    function renderCart() {

        const cart = getCart();

        cartItems.innerHTML = "";


        if (cart.length === 0) {

            cartLayout.style.display = "none";
            emptyCart.style.display = "block";

            cartCount.textContent = "0";

            return;

        }


        cartLayout.style.display = "grid";
        emptyCart.style.display = "none";


        let subtotal = 0;
        let itemCount = 0;


        cart.forEach((item, index) => {

            subtotal +=
                Number(item.price) *
                Number(item.quantity);

            itemCount += Number(item.quantity);


            const itemElement =
                document.createElement("div");

            itemElement.className = "cart-item";


            itemElement.innerHTML = `

                <div class="cart-image">

                    <i class="fa-regular fa-clock"></i>

                </div>


                <div class="cart-info">

                    <small>
                        NASSAH CONCEPT
                    </small>

                    <h3>
                        ${item.name}
                    </h3>

                    <div class="cart-price">
                        ${formatPrice(item.price)}
                    </div>


                    <div class="quantity">

                        <button
                            onclick="changeQuantity(${index}, -1)"
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>


                    <button
                        class="remove-item"
                        onclick="removeItem(${index})"
                    >
                        <i class="fa-solid fa-trash"></i>
                        Remove
                    </button>

                </div>


                <div class="item-total">

                    ${formatPrice(
                        Number(item.price) *
                        Number(item.quantity)
                    )}

                </div>

            `;


            cartItems.appendChild(itemElement);

        });


        const delivery =
            subtotal > 0 ? 3000 : 0;

        const total =
            subtotal + delivery;


        subtotalElement.textContent =
            formatPrice(subtotal);

        document.getElementById(
            "delivery"
        ).textContent =
            formatPrice(delivery);

        totalElement.textContent =
            formatPrice(total);

        cartCount.textContent =
            itemCount;

    }


    function changeQuantity(index, change) {

        const cart = getCart();

        cart[index].quantity += change;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        saveCart(cart);

        renderCart();

    }


    function removeItem(index) {

        const cart = getCart();

        cart.splice(index, 1);

        saveCart(cart);

        renderCart();

    }


    renderCart();

</script>


<script src="../js/script.js"></script>

</body>
</html>
